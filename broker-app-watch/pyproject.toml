[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "broker-app-watch"
version = "0.1.0"
description = "中国券商手机端 App 更新记录采集与分析项目骨架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2.2",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.40,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "markdownify>=0.13,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]
ocr = [
  "rapidocr-onnxruntime>=1.3,<2.0",
]

[project.scripts]
broker-app-watch = "broker_app_watch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/broker_app_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
