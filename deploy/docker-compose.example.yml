services:
  backend-api:
    image: 172.16.96.238:5000/broker-backend:v${BROKER_VERSION:-1.9.1}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      BROKER_VERSION: ${BROKER_VERSION:-1.9.1}
      SCHEDULER_ENABLED: "false"
    volumes:
      - ./runtime/data:/app/backend/data
      - ./runtime/scraper-output:/app/backend/python-http-www-cfcpn-com-jcw/output
      - ./runtime/app-watch-data:/app/backend/data/broker_app_watch
      - ./runtime/config/llm_api_config.json:/app/backend/config/llm_api_config.json:ro
      - ./runtime/config/user_qualification.csv:/app/backend/config/user_qualification.csv:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-scheduler:
    image: 172.16.96.238:5000/broker-backend:v${BROKER_VERSION:-1.9.1}
    platform: linux/amd64
    command: python -m backend.api.scheduler
    restart: unless-stopped
    environment:
      SCHEDULER_ENABLED: "true"
      SCHEDULER_API_URL: http://backend-api:8000
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:?SCHEDULER_TOKEN is required}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Shanghai}
      SCHEDULER_CRON: ${SCHEDULER_CRON:-0 12 * * sun}
      APP_WATCH_SCHEDULER_ENABLED: ${APP_WATCH_SCHEDULER_ENABLED:-false}
      APP_WATCH_SCHEDULER_CRON: ${APP_WATCH_SCHEDULER_CRON:-30 12 * * sun}
    depends_on:
      backend-api:
        condition: service_healthy

  frontend:
    image: 172.16.96.238:5000/broker-frontend:v${BROKER_VERSION:-1.9.1}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend-api:
        condition: service_healthy
