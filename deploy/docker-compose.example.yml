services:
  backend-api:
    image: broker-backend:${BROKER_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      SCHEDULER_ENABLED: "false"
      FRONTEND_DIST_PATH: /app/frontend/out
    volumes:
      - ./runtime/data:/app/backend/data
      - ./runtime/scraper-output:/app/backend/python-http-www-cfcpn-com-jcw/output
      - ./runtime/app-watch-data:/app/backend/data/broker_app_watch
      - ./runtime/config/llm_api_config.json:/app/backend/config/llm_api_config.json:ro
      - ./runtime/config/user_qualification.csv:/app/backend/config/user_qualification.csv:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-scheduler:
    image: broker-backend:${BROKER_VERSION}
    command: python -m backend.api.scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      SCHEDULER_ENABLED: "true"
      SCHEDULER_API_URL: http://backend-api:8000
    depends_on:
      backend-api:
        condition: service_healthy

  frontend:
    image: broker-frontend:${BROKER_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
